services:
  # Web Service
  - type: web
    name: kartal-metal-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kartal-metal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 10
      - key: COOKIE_MAX_AGE
        value: 86400000
      - key: REMEMBER_ME_DURATION
        value: 2592000000
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/webp,image/jpg
      - key: LOGIN_RATE_LIMIT
        value: 5
      - key: LOGIN_RATE_WINDOW
        value: 15
      - key: API_RATE_LIMIT
        value: 100
      - key: API_RATE_WINDOW
        value: 15

databases:
  # PostgreSQL Database
  - name: kartal-metal-db
    databaseName: kartal_metal_db
    user: kartal_metal_db_user
    plan: free
