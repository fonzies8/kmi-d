version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kartal_metal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1667
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kartal_metal_db
      - DB_USER=postgres
      - DB_PASSWORD=1667
      - PORT=3008
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3008:3008"
    volumes:
      - ./uploads:/usr/src/app/uploads
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data:
